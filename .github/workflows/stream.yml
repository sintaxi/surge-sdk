# The upload format, single files and the browser-safe project rules, on
# every platform the CLI runs on. test/pack.js compares the stream's own
# packer with node-tar 7 byte for byte on the same tree, so on Windows it
# proves the archive matches what node-tar (with its win32 path handling)
# sent before. No server needed. mocha 12 needs node >= 20.19; the 18.13
# floor is covered by bin/floor-check against a local slushi.
name: stream

on: [push, pull_request]

jobs:
  pack:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # --ignore-scripts: the root prepublish (npm run setversion) runs a
      # shebang script windows can't, and the tests need no install scripts
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: stream
      - run: npx mocha test/pack.js test/symlinks.js test/single.js test/project.js --timeout 30000 --exit
